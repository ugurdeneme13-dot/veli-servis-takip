<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şoför Paneli - Servis & Yoklama</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; max-width: 480px; margin: auto; background-color: #f4f6f9; color: #333; }
        h2, h3 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .kart { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ced4da; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-gps { background-color: #28a745; }
        .btn-sim { background-color: #007bff; }
        .btn-durdur { background-color: #dc3545; display: none; }
        .btn-ekle { background-color: #17a2b8; width: auto; padding: 12px 18px; }
        .ekle-grup { display: flex; gap: 8px; align-items: center; }
        .ekran-durum { margin-top: 8px; padding: 8px; border-radius: 5px; font-size: 13px; text-align: center; background: #e9ecef; }
        .ekran-aktif { background: #d4edda; color: #155724; font-weight: bold; }
        .bilgi { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; font-size: 14px; text-align: center; border: 1px solid #e9ecef; }
        
        /* Öğrenci Listesi Stilleri */
        .ogrenci-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; gap: 6px; flex-wrap: wrap; }
        .ogrenci-item:last-child { border-bottom: none; }
        .ogrenci-ad { font-weight: bold; font-size: 15px; flex: 1; min-width: 120px; }
        .durum-etiket { font-size: 12px; padding: 3px 7px; border-radius: 4px; display: inline-block; margin-top: 3px; }
        .etiket-bekliyor { background: #e2e3e5; color: #383d41; }
        .etiket-bindi { background: #d4edda; color: #155724; }
        .etiket-indi { background: #cce5ff; color: #004085; }
        .etiket-gelmedi { background: #f8d7da; color: #721c24; }
        
        .aksiyon-butonlar { display: flex; gap: 4px; }
        .mini-btn { padding: 8px 10px; border: none; border-radius: 5px; color: white; font-weight: bold; font-size: 13px; cursor: pointer; }
        .b-bindi { background: #28a745; }
        .b-indi { background: #007bff; }
        .b-gelmedi { background: #6c757d; }
        .b-sil { background: #dc3545; padding: 8px; }
    </style>
</head>
<body>
    <h2>🚌 Şoför Kontrol Paneli</h2>

    <!-- Konum ve Yayın Kartı -->
    <div class="kart">
        <input type="text" id="servisKodu" placeholder="Servis Kodu (Örn: 34S1001)" value="34S1001" style="text-align:center; font-weight:bold;">
        <button class="btn btn-gps" onclick="gercekGpsBaslat()">📍 Gerçek GPS ile Yayını Başlat</button>
        <button class="btn btn-sim" onclick="simulasyonBaslat()">🔄 Test Simülasyonu Başlat</button>
        <button id="btnDurdur" class="btn btn-durdur" onclick="yayiniDurdur()">⏹️ Yayını Durdur</button>
        <div class="ekran-durum" id="ekranDurum">Ekran Kilidi Önleyici: Beklemede</div>
        <div class="bilgi" id="durum">Durum: Konum yayını bekleniyor...</div>
    </div>

    <!-- Öğrenci Yoklama ve Bildirim Kartı -->
    <div class="kart">
        <h3>📋 Öğrenci Yoklama Listesi</h3>
        <div class="ekle-grup">
            <input type="text" id="yeniOgrenciAd" placeholder="Öğrenci Adı Soyadı">
            <button class="btn btn-ekle" onclick="ogrenciEkle()">+ Ekle</button>
        </div>
        <div id="ogrenciListesiAlani" style="margin-top: 12px;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let watchId = null;
        let simInterval = null;
        let wakeLock = null;
        let yayinAktif = false;

        // Varsayılan veya tarayıcıda kayıtlı öğrenci listesi
        let ogrenciler = JSON.parse(localStorage.getItem('servis_ogrenciler')) || [
            { id: 1, ad: "Ahmet Yılmaz", durum: "Bekliyor" },
            { id: 2, ad: "Zeynep Kaya", durum: "Bekliyor" },
            { id: 3, ad: "Mehmet Demir", durum: "Bekliyor" }
        ];

        function servisKodunuAl() {
            return document.getElementById('servisKodu').value.trim().toUpperCase() || "34S1001";
        }

        // Sayfa açıldığında listeyi çiz ve sunucuya bağlan
        window.onload = () => {
            listeyiCiz();
            socket.emit('soforListeyiGetir', servisKodunuAl());
        };

        function listeyiKaydetVeGonder(bildirimMesaji = null, ogrenciAdi = null, durum = null) {
            localStorage.setItem('servis_ogrenciler', JSON.stringify(ogrenciler));
            listeyiCiz();
            socket.emit('ogrenciDurumGuncelle', {
                servisKodu: servisKodunuAl(),
                ogrenciler: ogrenciler,
                bildirimMesaji: bildirimMesaji,
                ogrenciAdi: ogrenciAdi,
                durum: durum
            });
        }

        function ogrenciEkle() {
            const input = document.getElementById('yeniOgrenciAd');
            const ad = input.value.trim();
            if (!ad) return alert("Lütfen öğrenci adını yazın.");

            ogrenciler.push({ id: Date.now(), ad: ad, durum: "Bekliyor" });
            input.value = "";
            listeyiKaydetVeGonder();
        }

        function durumDegistir(id, yeniDurum) {
            const ogrenci = ogrenciler.find(o => o.id === id);
            if (!ogrenci) return;

            ogrenci.durum = yeniDurum;
            let mesaj = "";
            if (yeniDurum === "Bindi") mesaj = `✅ ${ogrenci.ad} servise BİNDİ.`;
            if (yeniDurum === "İndi") mesaj = `🏠 ${ogrenci.ad} servisten İNDİ.`;
            if (yeniDurum === "Gelmedi") mesaj = `❌ ${ogrenci.ad} bugün servise GELMEDİ.`;

            listeyiKaydetVeGonder(mesaj, ogrenci.ad, yeniDurum);
        }

        function ogrenciSil(id) {
            if (!confirm("Bu öğrenciyi listeden silmek istiyor musunuz?")) return;
            ogrenciler = ogrenciler.filter(o => o.id !== id);
            listeyiKaydetVeGonder();
        }

        function listeyiCiz() {
            const alan = document.getElementById('ogrenciListesiAlani');
            if (ogrenciler.length === 0) {
                alan.innerHTML = "<p style='text-align:center; color:#888;'>Listede öğrenci yok.</p>";
                return;
            }

            alan.innerHTML = ogrenciler.map(o => {
                let etiketSinif = "etiket-bekliyor";
                if (o.durum === "Bindi") etiketSinif = "etiket-bindi";
                if (o.durum === "İndi") etiketSinif = "etiket-indi";
                if (o.durum === "Gelmedi") etiketSinif = "etiket-gelmedi";

                return `
                <div class="ogrenci-item">
                    <div class="ogrenci-ad">
                        ${o.ad}<br>
                        <span class="durum-etiket ${etiketSinif}">${o.durum}</span>
                    </div>
                    <div class="aksiyon-butonlar">
                        <button class="mini-btn b-bindi" onclick="durumDegistir(${o.id}, 'Bindi')">Bindi</button>
                        <button class="mini-btn b-indi" onclick="durumDegistir(${o.id}, 'İndi')">İndi</button>
                        <button class="mini-btn b-gelmedi" onclick="durumDegistir(${o.id}, 'Gelmedi')">Yok</button>
                        <button class="mini-btn b-sil" onclick="ogrenciSil(${o.id})">🗑️</button>
                    </div>
                </div>`;
            }).join('');
        }

        // Ekranı Uyanık Tutma (Wake Lock)
        async function ekraniAcikTut() {
            const kutu = document.getElementById('ekranDurum');
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    kutu.innerText = "☀️ Ekran Açık Tutuluyor (Uyku Modu Engellendi)";
                    kutu.classList.add('ekran-aktif');
                } catch (e) {
                    kutu.innerText = "⚠️ Ekran kilidi engellenemedi";
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (yayinAktif && document.visibilityState === 'visible') await ekraniAcikTut();
        });

        function gercekGpsBaslat() {
            const kod = servisKodunuAl();
            if ("geolocation" in navigator) {
                yayinAktif = true;
                ekraniAcikTut();
                document.getElementById('btnDurdur').style.display = 'block';
                document.getElementById('durum').innerText = "GPS uydularına bağlanılıyor...";

                watchId = navigator.geolocation.watchPosition((pos) => {
                    socket.emit('konumGonder', {
                        servisKodu: kod,
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        durum: "Servis Hareket Halinde"
                    });
                    document.getElementById('durum').innerText = `✅ Yayın Aktif (${kod}) - Hız: ${pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0} km/s`;
                }, (err) => alert("Konum alınamadı: " + err.message), { enableHighAccuracy: true, maximumAge: 0 });
            }
        }

        function simulasyonBaslat() {
            const kod = servisKodunuAl();
            yayinAktif = true;
            ekraniAcikTut();
            document.getElementById('btnDurdur').style.display = 'block';

            let lat = 40.7731, lng = 30.3948;
            if (simInterval) clearInterval(simInterval);

            simInterval = setInterval(() => {
                lat += 0.0003;
                lng += 0.0002;
                socket.emit('konumGonder', { servisKodu: kod, lat, lng, durum: "Simülasyon Sürüşü" });
                document.getElementById('durum').innerText = `🔄 Simülasyon Aktif (${kod})`;
            }, 2000);
        }

        function yayiniDurdur() {
            yayinAktif = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (simInterval !== null) clearInterval(simInterval);
            if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
            document.getElementById('btnDurdur').style.display = 'none';
            document.getElementById('ekranDurum').innerText = "Ekran Kilidi Önleyici: Pasif";
            document.getElementById('ekranDurum').classList.remove('ekran-aktif');
            document.getElementById('durum').innerText = "Durum: Yayın durduruldu.";
        }
    </script>
</body>
</html>
