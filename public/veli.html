<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veli Servis Takip Ekranı</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .ust-bar { padding: 15px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input { padding: 10px; font-size: 16px; border-radius: 4px; border: none; }
        button { padding: 10px 20px; font-size: 16px; background: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #harita { flex-grow: 1; width: 100%; }
        #bilgi-kutusu { padding: 10px 15px; background: #ecf0f1; font-size: 14px; border-bottom: 1px solid #bdc3c7; }
    </style>
</head>
<body>
    <div class="ust-bar">
        <strong>Veli Takip:</strong>
        <input type="text" id="takipKodu" placeholder="Servis Kodu (Örn: 34S1001)" value="34S1001">
        <button onclick="takibiBaslat()">Servisi Bul</button>
    </div>
    <div id="bilgi-kutusu">Servis bekleniyor...</div>
    <div id="harita"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Haritayı başlat
        const map = L.map('harita').setView([40.9607, 29.2675], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let servisMarker = null;

        function takibiBaslat() {
            const kod = document.getElementById('takipKodu').value.trim().toUpperCase();
            if (!kod) return alert("Lütfen servis kodu girin!");

            socket.emit('serviseAboneOl', kod);
            document.getElementById('bilgi-kutusu').innerText = `${kod} plakalı servis takip ediliyor. Konum bekleniyor...`;
        }

        socket.on('konumGuncellendi', (veri) => {
            const yeniKonum = [veri.lat, veri.lng];

            if (!servisMarker) {
                servisMarker = L.marker(yeniKonum).addTo(map)
                    .bindPopup("Okul Servisi").openPopup();
            } else {
                servisMarker.setLatLng(yeniKonum);
            }

            map.panTo(yeniKonum); // Haritayı araca ortala
            document.getElementById('bilgi-kutusu').innerText = 
                `Durum: ${veri.durum} | Son Güncelleme: ${veri.sonGuncelleme}`;
        });
    </script>
</body>
</html>
