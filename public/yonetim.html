<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>Yönetim Paneli</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=8627d205-12fc-4c1b-b8c8-1abb08d3de62&lang=tr_TR" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 10px; background-color: #f1f5f9; color: #1e293b; }
        .konteyner { max-width: 720px; margin: auto; }
        
        .baslik-bar { background: #1e293b; color: white; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
        .baslik-bar h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
        .linkler { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .linkler a { background: #334155; color: #facc15; text-decoration: none; font-weight: bold; font-size: 14px; padding: 10px; border-radius: 8px; text-align: center; }
        
        .kart { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px; }
        .kart h3 { margin: 0 0 12px 0; font-size: 16px; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-grup { display: flex; flex-direction: column; }
        .tam-satir { grid-column: 1 / -1; }
        .form-grup label { font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #475569; }
        .form-grup input { height: 46px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; background: #f8fafc; }
        
        .btn-gps-al { width: 100%; height: 46px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        #konumSeciciHarita { width: 100%; height: 240px; border-radius: 10px; border: 2px solid #cbd5e1; }
        .konum-bilgi { font-size: 13px; color: #dc2626; margin-top: 6px; font-weight: bold; text-align: center; }
        .konum-secildi { color: #16a34a; }

        .btn-grup { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 100%; height: 50px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-kaydet { background: #16a34a; color: white; }
        .btn-temizle { background: #64748b; color: white; height: 42px; font-size: 14px; }
        
        .arama-kutusu { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }

        /* Mobil Öğrenci Kayıt Kartları */
        .kayit-kart { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #f8fafc; }
        .kayit-ust { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .kayit-ad { font-size: 16px; font-weight: bold; color: #0f172a; }
        .plaka-rozet { background: #1e293b; color: #facc15; padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .kayit-detay { font-size: 13px; color: #475569; line-height: 1.5; margin-bottom: 10px; }
        
        .kayit-aksiyonlar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .k-btn { height: 38px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-harita { background: #0284c7; color: white; }
        .btn-duzenle { background: #facc15; color: #0f172a; }
        .btn-sil { background: #dc2626; color: white; }
    </style>
</head>
<body>
    <div class="konteyner">
        <div class="baslik-bar">
            <h2>🛠️ Öğrenci & Konum Yönetimi</h2>
            <div class="linkler">
                <a href="/sofor.html">🚌 Şoför Ekranı</a>
                <a href="/veli.html">👨‍👩‍👧 Veli Ekranı</a>
            </div>
        </div>

        <div class="kart">
            <h3 id="formBaslik">➕ Yeni Öğrenci Kaydı</h3>
            <input type="hidden" id="duzenlenenId">
            <div class="form-grid">
                <div class="form-grup">
                    <label>Sıra No *</label>
                    <input type="number" id="siraNo" placeholder="1" min="1">
                </div>
                <div class="form-grup">
                    <label>Araç Plakası *</label>
                    <input type="text" id="plaka" placeholder="34S1001" value="34S1001" style="text-transform: uppercase;">
                </div>
                <div class="form-grup tam-satir">
                    <label>Öğrenci Adı Soyadı *</label>
                    <input type="text" id="ogrenciAd" placeholder="Örn: Ahmet Yılmaz">
                </div>
                <div class="form-grup tam-satir">
                    <label>Veli Adı Soyadı *</label>
                    <input type="text" id="veliAd" placeholder="Örn: Mustafa Yılmaz">
                </div>
                <div class="form-grup">
                    <label>Veli Tel 1 *</label>
                    <input type="tel" id="veliTel1" placeholder="0532...">
                </div>
                <div class="form-grup">
                    <label>Veli Tel 2</label>
                    <input type="tel" id="veliTel2" placeholder="0542...">
                </div>
                <div class="form-grup tam-satir">
                    <label>Açık Adres</label>
                    <input type="text" id="adres" placeholder="Mahalle, Sokak, No...">
                </div>
                <div class="form-grup tam-satir">
                    <label>Ev Konumu *</label>
                    <button type="button" class="btn-gps-al" onclick="mevcutGpsKonumunuAl()">📍 Şu Anki GPS Konumumu Kullan</button>
                    <div id="konumSeciciHarita"></div>
                    <div class="konum-bilgi" id="seciliKonumMetni">⚠️ Haritadan ev konumuna dokunun</div>
                    <input type="hidden" id="lat">
                    <input type="hidden" id="lng">
                </div>
            </div>
            <div class="btn-grup">
                <button class="btn btn-kaydet" onclick="kaydiKaydet()">💾 Kaydet</button>
                <button class="btn btn-temizle" onclick="formuTemizle()">Temizle / İptal</button>
            </div>
        </div>

        <div class="kart">
            <h3>📋 Kayıtlı Öğrenciler (<span id="toplamSayi">0</span>)</h3>
            <input type="text" class="arama-kutusu" id="aramaKutusu" onkeyup="tabloyuCiz()" placeholder="Plaka, öğrenci veya veli ara...">
            <div id="ogrenciKartListesi"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let seciciMap = null, seciciPlacemark = null, tumKayitlar = [];

        socket.on('connect', () => socket.emit('yonetimTumunuGetir'));

        socket.on('yonetimVeriListesi', (sunucuKayitlari) => {
            tumKayitlar = sunucuKayitlari || [];
            otomatikSiraNoBelirle();
            tabloyuCiz();
        });

        ymaps.ready(() => {
            seciciMap = new ymaps.Map("konumSeciciHarita", {
                center: [40.7731, 30.3948],
                zoom: 13,
                controls: ['zoomControl', 'searchControl']
            });

            seciciPlacemark = new ymaps.Placemark([40.7731, 30.3948], {}, { preset: 'islands#redHomeIcon', draggable: true });
            seciciMap.geoObjects.add(seciciPlacemark);

            seciciMap.events.add('click', (e) => {
                const coords = e.get('coords');
                konumuGuncelle(coords[0], coords[1]);
            });

            seciciPlacemark.events.add('dragend', () => {
                const coords = seciciPlacemark.geometry.getCoordinates();
                konumuGuncelle(coords[0], coords[1]);
            });
        });

        function konumuGuncelle(lat, lng) {
            const latStr = Number(lat).toFixed(6);
            const lngStr = Number(lng).toFixed(6);
            document.getElementById('lat').value = latStr;
            document.getElementById('lng').value = lngStr;
            
            const bilgiEl = document.getElementById('seciliKonumMetni');
            bilgiEl.innerText = `✅ Konum Seçildi: ${latStr}, ${lngStr}`;
            bilgiEl.classList.add('konum-secildi');

            if (seciciPlacemark) seciciPlacemark.geometry.setCoordinates([Number(lat), Number(lng)]);
        }

        function mevcutGpsKonumunuAl() {
            if (!("geolocation" in navigator)) return alert("GPS desteklenmiyor.");
            document.getElementById('seciliKonumMetni').innerText = "📡 Konum alınıyor...";
            navigator.geolocation.getCurrentPosition((pos) => {
                konumuGuncelle(pos.coords.latitude, pos.coords.longitude);
                if (seciciMap) seciciMap.setCenter([pos.coords.latitude, pos.coords.longitude], 17);
            }, (err) => alert("Konum alınamadı: " + err.message), { enableHighAccuracy: true });
        }

        function otomatikSiraNoBelirle() {
            if (document.getElementById('duzenlenenId').value) return;
            const maxSira = tumKayitlar.reduce((max, item) => Math.max(max, Number(item.siraNo) || 0), 0);
            document.getElementById('siraNo').value = maxSira + 1;
        }

        function kaydiKaydet() {
            const duzenlenenId = document.getElementById('duzenlenenId').value;
            const siraNo = Number(document.getElementById('siraNo').value);
            const ogrenciAd = document.getElementById('ogrenciAd').value.trim();
            const veliAd = document.getElementById('veliAd').value.trim();
            const plaka = document.getElementById('plaka').value.trim().toUpperCase().replace(/\s+/g, '');
            const veliTel1 = document.getElementById('veliTel1').value.trim();
            const veliTel2 = document.getElementById('veliTel2').value.trim();
            const adres = document.getElementById('adres').value.trim();
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;

            if (!ogrenciAd || !veliAd || !plaka || !veliTel1) return alert("Zorunlu alanları doldurun!");
            if (!lat || !lng) return alert("Lütfen ev konumunu işaretleyin!");

            if (duzenlenenId) {
                const index = tumKayitlar.findIndex(k => k.id == duzenlenenId);
                if (index !== -1) {
                    tumKayitlar[index] = { ...tumKayitlar[index], siraNo, ogrenciAd, veliAd, plaka, veliTel1, veliTel2, adres, lat, lng };
                }
            } else {
                tumKayitlar.push({ id: Date.now(), siraNo, ogrenciAd, veliAd, plaka, veliTel1, veliTel2, adres, lat, lng, durum: "Bekliyor" });
            }

            tumKayitlar.sort((a, b) => a.siraNo - b.siraNo);
            socket.emit('yonetimKayitGuncelle', tumKayitlar);
            formuTemizle();
        }

        function kaydiDuzenle(id) {
            const k = tumKayitlar.find(item => item.id == id);
            if (!k) return;

            document.getElementById('formBaslik').innerText = "✏️ Kaydı Düzenle";
            document.getElementById('duzenlenenId').value = k.id;
            document.getElementById('siraNo').value = k.siraNo;
            document.getElementById('ogrenciAd').value = k.ogrenciAd;
            document.getElementById('veliAd').value = k.veliAd;
            document.getElementById('plaka').value = k.plaka;
            document.getElementById('veliTel1').value = k.veliTel1;
            document.getElementById('veliTel2').value = k.veliTel2 || "";
            document.getElementById('adres').value = k.adres || "";
            
            if (k.lat && k.lng) {
                konumuGuncelle(k.lat, k.lng);
                if (seciciMap) seciciMap.setCenter([Number(k.lat), Number(k.lng)], 16);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function kaydiSil(id) {
            if (!confirm("Kaydı silmek istiyor musunuz?")) return;
            tumKayitlar = tumKayitlar.filter(k => k.id != id);
            socket.emit('yonetimKayitGuncelle', tumKayitlar);
        }

        function formuTemizle() {
            document.getElementById('formBaslik').innerText = "➕ Yeni Öğrenci Kaydı";
            document.getElementById('duzenlenenId').value = "";
            document.getElementById('ogrenciAd').value = "";
            document.getElementById('veliAd').value = "";
            document.getElementById('veliTel1').value = "";
            document.getElementById('veliTel2').value = "";
            document.getElementById('adres').value = "";
            document.getElementById('lat').value = "";
            document.getElementById('lng').value = "";
            
            const bilgiEl = document.getElementById('seciliKonumMetni');
            bilgiEl.innerText = "⚠️ Haritadan ev konumuna dokunun";
            bilgiEl.classList.remove('konum-secildi');
            otomatikSiraNoBelirle();
        }

        function tabloyuCiz() {
            const arama = document.getElementById('aramaKutusu').value.toLowerCase();
            const alan = document.getElementById('ogrenciKartListesi');
            
            const filtrelenmis = tumKayitlar.filter(k => 
                k.ogrenciAd.toLowerCase().includes(arama) ||
                k.veliAd.toLowerCase().includes(arama) ||
                k.plaka.toLowerCase().includes(arama)
            );

            document.getElementById('toplamSayi').innerText = filtrelenmis.length;

            if (filtrelenmis.length === 0) {
                alan.innerHTML = `<div style="text-align:center; color:#64748b; padding:15px;">Kayıt bulunamadı.</div>`;
                return;
            }

            alan.innerHTML = filtrelenmis.map(k => `
                <div class="kayit-kart">
                    <div class="kayit-ust">
                        <span class="kayit-ad">${k.siraNo}. ${k.ogrenciAd}</span>
                        <span class="plaka-rozet">${k.plaka}</span>
                    </div>
                    <div class="kayit-detay">
                        <strong>Veli:</strong> ${k.veliAd}<br>
                        <strong>Tel:</strong> <a href="tel:${k.veliTel1}" style="color:#0284c7;">${k.veliTel1}</a> ${k.veliTel2 ? `/ <a href="tel:${k.veliTel2}" style="color:#0284c7;">${k.veliTel2}</a>` : ''}<br>
                        ${k.adres ? `<strong>Adres:</strong> ${k.adres}` : ''}
                    </div>
                    <div class="kayit-aksiyonlar">
                        <a class="k-btn btn-harita" href="https://yandex.com.tr/harita/?pt=${k.lng},${k.lat}&z=16&l=map" target="_blank">📍 Harita</a>
                        <button class="k-btn btn-duzenle" onclick="kaydiDuzenle(${k.id})">✏️ Düzenle</button>
                        <button class="k-btn btn-sil" onclick="kaydiSil(${k.id})">🗑️ Sil</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
